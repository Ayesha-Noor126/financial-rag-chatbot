name: CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Testing & Coverage
  # ============================================================================
  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements*.txt"

      - name: Install PyTorch (CPU-only)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1 --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install Backend Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Download spaCy Model
        run: |
          python -m spacy download en_core_web_sm

      - name: Run Pytest with Coverage
        working-directory: ./backend
        env:
          LLM_API_KEY: "dummy-key-for-ci"
          LANGFUSE_ENABLED: "false"
          ENABLE_LIVE_EVAL: "false"
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml

  # ============================================================================
  # 2. Frontend Code Quality & Production Build
  # ============================================================================
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Frontend Asset Bundle
        run: npm run build

  # ============================================================================
  # 3. Docker Image Build Verification
  # ============================================================================
  docker-build:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: fin-rag-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: fin-rag-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 4. Docker Compose Integration Smoke Test
  # ============================================================================
  integration-smoke-test:
    name: Docker Compose Integration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create mock .env file for Compose
        run: |
          cat << 'EOF' > .env
          LLM_PROVIDER=groq
          LLM_API_KEY=gsk_ci_dummy_key_for_healthcheck_12345
          GROQ_API_KEY=gsk_ci_dummy_key_for_healthcheck_12345
          LLM_MODEL=llama-3.3-70b-versatile
          LLM_BASE_URL=https://api.groq.com/openai/v1
          TAVILY_API_KEY=tvly-ci_dummy_key
          LANGFUSE_PUBLIC_KEY=pk-lf-dummy
          LANGFUSE_SECRET_KEY=sk-lf-dummy
          LANGFUSE_BASE_URL=https://us.cloud.langfuse.com
          VITE_API_URL=http://localhost:8000
          EOF

      - name: Start services with Docker Compose
        run: docker compose up --build -d

      - name: Wait for services to become healthy
        run: |
          echo "Waiting for containers to report healthy..."
          timeout 120s bash -c '
            until [ "$(docker inspect --format="{{.State.Health.Status}}" fin-rag-backend)" == "healthy" ] && \
                  [ "$(docker inspect --format="{{.State.Health.Status}}" fin-rag-frontend)" == "healthy" ]; do
              echo "Waiting for containers..."
              sleep 3
            done
          '

      - name: Verify Backend Health Endpoint
        run: |
          curl -f http://localhost:8000/health || exit 1

      - name: Verify Frontend HTTP Endpoint
        run: |
          curl -f http://localhost/ || exit 1

      - name: Container Logs on Failure
        if: failure()
        run: |
          docker compose logs
