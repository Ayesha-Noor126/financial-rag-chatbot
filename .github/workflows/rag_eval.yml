name: Scheduled RAG Evaluation

# ────────────────────────────────────────────────────────────────────────────
# CONCEPTUAL DESIGN
# ─────────────────
# This workflow performs REAL RAG regression testing, not fake automation.
#
# What it actually does:
#   1. Installs the full backend stack (PyTorch, spaCy, HuggingFace models).
#   2. Starts a live uvicorn server in the background.
#   3. Runs tests/eval/run_rag_eval.py which:
#        a) Generates a synthetic financial PDF with fpdf2.
#        b) Ingests it via POST /upload (full pipeline: parse→chunk→embed→index).
#        c) Asks each question from golden_qa.json via GET /debug/answer.
#        d) Scores answers with DeepEval (FaithfulnessMetric, AnswerRelevancyMetric,
#           ContextualPrecisionMetric, ContextualRecallMetric) using GroqJudge.
#        e) Compares scores against baseline_metrics.json (downloaded from the
#           last successful run artifact).
#        f) Fails with exit code 1 if any metric drops more than 10% vs baseline.
#   4. Uploads eval_results.json as a GitHub Actions artifact (90-day retention).
#   5. Writes a markdown summary table to GITHUB_STEP_SUMMARY for visibility.
#
# On the first run, baseline_metrics.json has all zeros so no regression fires.
# After each successful run, download the artifact and commit the new baseline
# to establish a real regression threshold for subsequent runs.
#
# REQUIRED SECRET: GROQ_API_KEY
#   GitHub → Repository → Settings → Secrets → New secret → GROQ_API_KEY
#   Without it, DeepEval scoring is skipped and only confidence_score is checked.
# ────────────────────────────────────────────────────────────────────────────

on:
  # Weekly: every Monday at 02:00 UTC (off-peak, after weekend changes settle)
  schedule:
    - cron: "0 2 * * 1"

  # Monthly: first day of each month at 03:00 UTC (trend + summary)
  # Uses a separate job step activated by date check rather than a separate trigger.
    - cron: "0 3 1 * *"

  # Manual trigger for ad-hoc evaluation or after intentional improvements
  workflow_dispatch:
    inputs:
      threshold:
        description: "Regression threshold % (default: 10)"
        required: false
        default: "10"
      update_baseline:
        description: "Set to 'true' to commit updated baseline after a clean run"
        required: false
        default: "false"

concurrency:
  # Only one eval run at a time — they are slow and resource-intensive
  group: rag-eval
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Job 1: Full RAG Evaluation (runs every Monday + first of month)
  # ============================================================================
  rag-evaluation:
    name: RAG Pipeline Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 90   # HuggingFace model download + full eval pipeline

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_PROVIDER: groq
      LLM_MODEL: llama-3.3-70b-versatile
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LANGFUSE_ENABLED: "false"
      ENABLE_LIVE_EVAL: "false"
      APP_BASE_URL: http://localhost:8000
      REGRESSION_THRESHOLD: ${{ github.event.inputs.threshold || '10' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python & Dependency Setup ──────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements*.txt"

      - name: Install PyTorch (CPU-only)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1 --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install Backend + Dev Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Download spaCy Model
        run: python -m spacy download en_core_web_sm

      # Cache HuggingFace model weights across eval runs (2.5 GB total)
      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-bge-large-bge-reranker-v1
          restore-keys: hf-models-

      - name: Download HuggingFace Embedding & Reranker Models
        run: |
          python -c "
          from sentence_transformers import SentenceTransformer, CrossEncoder
          SentenceTransformer('BAAI/bge-large-en-v1.5')
          CrossEncoder('BAAI/bge-reranker-base')
          print('Models ready.')
          "

      # ── Baseline Download ──────────────────────────────────────────────────
      - name: Download Previous Eval Baseline (if exists)
        uses: actions/download-artifact@v4
        with:
          name: rag-eval-baseline
          path: backend/tests/eval/
        continue-on-error: true   # First run: no artifact yet — this is fine

      # ── Start Backend Server ───────────────────────────────────────────────
      - name: Start Backend Server (background)
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV

      - name: Wait for Backend to be Healthy
        run: |
          echo "Waiting for backend health check..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i/30 — waiting..."
            sleep 5
          done
          echo "Backend failed to start within 150s"
          exit 1

      # ── Run RAG Evaluation ─────────────────────────────────────────────────
      - name: Run Golden QA Evaluation Suite
        working-directory: backend
        run: |
          python -m tests.eval.run_rag_eval \
            --threshold ${{ env.REGRESSION_THRESHOLD }} \
            --baseline tests/eval/baseline_metrics.json \
            --output eval_results.json \
            --base-url ${{ env.APP_BASE_URL }} \
          | tee eval_output.txt
          # Capture exit code explicitly (tee swallows it otherwise)
          exit ${PIPESTATUS[0]}

      # ── Write GitHub Step Summary ──────────────────────────────────────────
      - name: Write Summary to GitHub Actions UI
        if: always()
        run: |
          cat backend/eval_output.txt >> $GITHUB_STEP_SUMMARY

      # ── Upload Results as Artifact ─────────────────────────────────────────
      - name: Upload Eval Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-results-${{ github.run_id }}
          path: backend/eval_results.json
          retention-days: 90

      # ── Update Baseline for Next Run ───────────────────────────────────────
      # Upload current results as the new baseline artifact so the NEXT run
      # downloads it and compares against it. This creates a rolling baseline
      # where each successful weekly run becomes the reference for the next.
      - name: Update Baseline Artifact (on success)
        if: success()
        run: |
          python - << 'EOF'
          import json, pathlib
          results = json.loads(pathlib.Path("backend/eval_results.json").read_text())
          baseline = {
              "avg_faithfulness":         results["avg_faithfulness"],
              "avg_answer_relevancy":     results["avg_answer_relevancy"],
              "avg_contextual_precision": results["avg_contextual_precision"],
              "avg_contextual_recall":    results["avg_contextual_recall"],
          }
          pathlib.Path("backend/tests/eval/baseline_metrics.json").write_text(
              json.dumps(baseline, indent=2)
          )
          print(f"New baseline: {baseline}")
          EOF

      - name: Upload Updated Baseline Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-baseline
          path: backend/tests/eval/baseline_metrics.json
          retention-days: 365   # Keep baseline for a full year

      # ── Teardown ───────────────────────────────────────────────────────────
      - name: Stop Backend Server
        if: always()
        run: |
          if [ -n "${BACKEND_PID}" ]; then
            kill $BACKEND_PID || true
          fi

  # ============================================================================
  # Job 2: Monthly Trend Report (runs on first day of each month)
  # ============================================================================
  monthly-trend-report:
    name: Monthly Evaluation Trend Report
    runs-on: ubuntu-latest
    # Only run on the monthly schedule or when manually triggered
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
       startsWith(github.event.schedule, '0 3 1'))
    needs: rag-evaluation
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download the last 4 weekly eval results artifacts for trend analysis
      - name: Download All Recent Eval Results
        uses: actions/download-artifact@v4
        with:
          pattern: rag-eval-results-*
          merge-multiple: true
          path: trend_data/

      - name: Generate Monthly Trend Report
        run: |
          python - << 'EOF'
          import json, os, pathlib, sys
          from datetime import datetime

          trend_dir = pathlib.Path("trend_data")
          results = []
          for f in sorted(trend_dir.glob("eval_results.json"), key=lambda p: p.stat().st_mtime, reverse=True)[:4]:
              try:
                  data = json.loads(f.read_text())
                  results.append(data)
              except Exception as e:
                  print(f"Warning: could not read {f}: {e}")

          if not results:
              print("No eval results found for trend analysis.")
              sys.exit(0)

          print("# Monthly RAG Evaluation Trend Report\n")
          print(f"Generated: {datetime.utcnow().isoformat()}\n")
          print("| Run | Timestamp | Faithfulness | Answer Relevancy | Prec | Recall | Confidence Pass |")
          print("|---|---|---|---|---|---|---|")
          for r in results:
              ts = r.get("timestamp", "N/A")[:19]
              rid = r.get("run_id", "N/A")
              f   = r.get("avg_faithfulness", 0)
              ar  = r.get("avg_answer_relevancy", 0)
              cp  = r.get("avg_contextual_precision", 0)
              cr  = r.get("avg_contextual_recall", 0)
              total = r.get("total_questions", 0)
              passed = r.get("passed_confidence", 0)
              print(f"| {rid} | {ts} | {f:.3f} | {ar:.3f} | {cp:.3f} | {cr:.3f} | {passed}/{total} |")

          # Trend direction
          if len(results) >= 2:
              delta_f = results[0].get("avg_faithfulness", 0) - results[-1].get("avg_faithfulness", 0)
              trend = "🔺 improving" if delta_f > 0.02 else ("🔻 degrading" if delta_f < -0.02 else "➡️ stable")
              print(f"\nFaithfulness trend over last {len(results)} runs: **{trend}** (Δ{delta_f:+.3f})")
          EOF
          python - << 'EOF' >> $GITHUB_STEP_SUMMARY
          import json, os, pathlib, sys
          from datetime import datetime

          trend_dir = pathlib.Path("trend_data")
          results = []
          for f in sorted(trend_dir.glob("eval_results.json"), key=lambda p: p.stat().st_mtime, reverse=True)[:4]:
              try:
                  data = json.loads(f.read_text())
                  results.append(data)
              except Exception:
                  pass

          if not results:
              sys.exit(0)

          print("# Monthly RAG Evaluation Trend Report\n")
          print(f"Generated: {datetime.utcnow().isoformat()}\n")
          print("| Run | Timestamp | Faithfulness | Answer Relevancy | Prec | Recall | Confidence Pass |")
          print("|---|---|---|---|---|---|---|")
          for r in results:
              ts = r.get("timestamp", "N/A")[:19]
              rid = r.get("run_id", "N/A")
              f   = r.get("avg_faithfulness", 0)
              ar  = r.get("avg_answer_relevancy", 0)
              cp  = r.get("avg_contextual_precision", 0)
              cr  = r.get("avg_contextual_recall", 0)
              total = r.get("total_questions", 0)
              passed = r.get("passed_confidence", 0)
              print(f"| {rid} | {ts} | {f:.3f} | {ar:.3f} | {cp:.3f} | {cr:.3f} | {passed}/{total} |")
          EOF
