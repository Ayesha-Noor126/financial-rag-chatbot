services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fin-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - STORAGE_DIR=/app/storage
    volumes:
      - backend_storage:/app/storage
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - fin-rag-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: fin-rag-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - fin-rag-net

volumes:
  backend_storage:
    driver: local
  hf_cache:
    driver: local

networks:
  fin-rag-net:
    driver: bridge
